# Production Docker Compose - Uses pre-built images from GHCR
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Use this when deploying with pre-built images from the container registry.
# Images are built and pushed by CI/CD on each release.

services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_USER: isekai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-isekai}
      POSTGRES_DB: isekai
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U isekai']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isekai-network

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isekai-network

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    ports:
      - '${MINIO_API_PORT:-9000}:9000' # S3 API
      - '${MINIO_CONSOLE_PORT:-9001}:9001' # Web Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - isekai-network

  # Creates the default bucket on startup
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-isekai-uploads}
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb myminio/$${S3_BUCKET_NAME:-isekai-uploads} --ignore-existing;
      mc anonymous set download myminio/$${S3_BUCKET_NAME:-isekai-uploads};
      exit 0;
      "
    networks:
      - isekai-network

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/isekai-sh/isekai-backend:0.1.0-alpha.12}
    # Run the bundled Prisma CLI directly so migrations remain deterministic.
    command:
      - /bin/sh
      - -c
      - >-
        cd /app/packages/shared &&
        ./node_modules/.bin/prisma migrate deploy &&
        exec node /app/apps/isekai-backend/dist/index.js
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    environment:
      # Database & Cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-isekai}:${POSTGRES_PASSWORD:-isekai}@postgres:5432/${POSTGRES_DB:-isekai}
      REDIS_URL: redis://redis:6379

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PORT: 4000
      NODE_ENV: production

      # Security (CHANGE THESE!)
      SESSION_SECRET: ${SESSION_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-7}
      REFRESH_TOKEN_EXPIRY_DAYS: ${REFRESH_TOKEN_EXPIRY_DAYS:-90}

      # ComfyUI upload policy (fail closed by default)
      COMFYUI_ALLOW_DIRECT_TO_DRAFT: ${COMFYUI_ALLOW_DIRECT_TO_DRAFT:-false}

      # DeviantArt OAuth (REQUIRED)
      DEVIANTART_CLIENT_ID: ${DEVIANTART_CLIENT_ID}
      DEVIANTART_CLIENT_SECRET: ${DEVIANTART_CLIENT_SECRET}
      DEVIANTART_REDIRECT_URI: ${DEVIANTART_REDIRECT_URI:-http://localhost:4000/api/auth/deviantart/callback}

      # S3-Compatible Storage (defaults to local MinIO, override for production)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-isekai-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/isekai-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

      # Session Storage
      SESSION_STORE: ${SESSION_STORE:-redis}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isekai-network
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:4000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  publisher:
    image: ${PUBLISHER_IMAGE:-ghcr.io/isekai-sh/isekai-publisher:0.1.0-alpha.12}
    ports:
      - '${PUBLISHER_HEALTH_PORT:-8000}:8000'
    environment:
      # Database & Cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-isekai}:${POSTGRES_PASSWORD:-isekai}@postgres:5432/${POSTGRES_DB:-isekai}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production

      # DeviantArt OAuth (same credentials as backend)
      DEVIANTART_CLIENT_ID: ${DEVIANTART_CLIENT_ID}
      DEVIANTART_CLIENT_SECRET: ${DEVIANTART_CLIENT_SECRET}

      # S3-Compatible Storage (defaults to local MinIO, override for production)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-isekai-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/isekai-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}

      # Publisher Configuration
      PUBLISHER_CONCURRENCY: ${PUBLISHER_CONCURRENCY:-5}
      PUBLISHER_MAX_ATTEMPTS: ${PUBLISHER_MAX_ATTEMPTS:-7}
      PUBLISHER_JOB_TIMEOUT_MS: ${PUBLISHER_JOB_TIMEOUT_MS:-600000}
      PUBLISHER_STALE_CHECK_INTERVAL_MS: ${PUBLISHER_STALE_CHECK_INTERVAL_MS:-60000}
      PUBLISHER_MAX_STALLED_COUNT: ${PUBLISHER_MAX_STALLED_COUNT:-2}

      # Rate Limiter
      RATE_LIMITER_ENABLED: ${RATE_LIMITER_ENABLED:-true}
      RATE_LIMITER_BASE_DELAY_MS: ${RATE_LIMITER_BASE_DELAY_MS:-3000}
      RATE_LIMITER_MAX_DELAY_MS: ${RATE_LIMITER_MAX_DELAY_MS:-300000}
      RATE_LIMITER_JITTER_PERCENT: ${RATE_LIMITER_JITTER_PERCENT:-20}
      RATE_LIMITER_SUCCESS_DECREASE_FACTOR: ${RATE_LIMITER_SUCCESS_DECREASE_FACTOR:-0.9}
      RATE_LIMITER_FAILURE_INCREASE_FACTOR: ${RATE_LIMITER_FAILURE_INCREASE_FACTOR:-2.0}

      # Circuit Breaker
      CIRCUIT_BREAKER_ENABLED: ${CIRCUIT_BREAKER_ENABLED:-true}
      CIRCUIT_BREAKER_THRESHOLD: ${CIRCUIT_BREAKER_THRESHOLD:-3}
      CIRCUIT_BREAKER_OPEN_DURATION_MS: ${CIRCUIT_BREAKER_OPEN_DURATION_MS:-300000}
      CIRCUIT_BREAKER_PERSIST_TO_REDIS: ${CIRCUIT_BREAKER_PERSIST_TO_REDIS:-true}

      # Cache
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_DEFAULT_TTL: ${CACHE_DEFAULT_TTL:-300}
      CACHE_STALE_TTL: ${CACHE_STALE_TTL:-7200}

      # Metrics
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_FLUSH_INTERVAL_MS: ${METRICS_FLUSH_INTERVAL_MS:-60000}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Health Check
      HEALTH_CHECK_PORT: 8000
      HEALTH_CHECK_ENABLED: true
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - isekai-network
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  media-worker:
    image: ${PUBLISHER_IMAGE:-ghcr.io/isekai-sh/isekai-publisher:0.1.0-alpha.12}
    command: ['node', 'dist/media-worker.js']
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-isekai}:${POSTGRES_PASSWORD:-isekai}@postgres:5432/${POSTGRES_DB:-isekai}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-isekai-uploads}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/isekai-uploads}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      THUMBNAIL_CONCURRENCY: ${THUMBNAIL_CONCURRENCY:-1}
      THUMBNAIL_SHARP_CONCURRENCY: ${THUMBNAIL_SHARP_CONCURRENCY:-1}
      THUMBNAIL_SHARP_CACHE_MB: ${THUMBNAIL_SHARP_CACHE_MB:-64}
      THUMBNAIL_RECONCILE_INTERVAL_MS: ${THUMBNAIL_RECONCILE_INTERVAL_MS:-60000}
      THUMBNAIL_RECONCILE_BATCH_SIZE: ${THUMBNAIL_RECONCILE_BATCH_SIZE:-100}
      MEDIA_HEALTH_PORT: 8001
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: ${MEDIA_WORKER_MEMORY_LIMIT:-2g}
    networks:
      - isekai-network
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8001/ready || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/isekai-sh/isekai-frontend:0.1.0-alpha.12}
    ports:
      - '${FRONTEND_PORT:-3000}:80'
    environment:
      # Runtime configuration (injected by entrypoint script)
      # These values can be changed without rebuilding the image!
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
      VITE_DEVIANTART_CLIENT_ID: ${DEVIANTART_CLIENT_ID}
      VITE_S3_PUBLIC_URL: ${S3_PUBLIC_URL:-http://localhost:9000/isekai-uploads}
    env_file:
      - .env
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - isekai-network
    healthcheck:
      # nginx listens on IPv4; BusyBox resolves localhost to ::1 first.
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:80/']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  isekai-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
